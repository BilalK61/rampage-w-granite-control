[package]
name = "aether-rgb"
version = "0.1.0"
edition = "2021"
description = "W-Control — Rust/Tauri backend"

[[bin]]
name = "aether-rgb"
path = "src/main.rs"

[lib]
name = "aether_rgb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
tokio = { version = "1", features = ["full"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
assert_matches = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
